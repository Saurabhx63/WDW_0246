<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lists</title>
</head>
<body>
  <h3>Unordered</h3>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>
 
  <h3>Ordered</h3>
  <!-- type="A" gives A, B, C instead of 1, 2, 3 -->
  <ol type="A">
    <li>Install VS Code</li>
    <li>Create file</li>
    <li>Open in browser</li>
  </ol>
 
  <h3>Description</h3>
  <dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
  </dl>
</body>
</html>
