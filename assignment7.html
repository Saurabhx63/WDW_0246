<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Menu</title>
  <style>
    ul {
      list-style: none;          /* remove the bullets */
      margin: 0;
      padding: 0;
      background-color: #333333; /* dark bar */
      overflow: hidden;
    }
    li {
      display: inline-block;     /* put items in one line */
    }
    a {
      display: block;
      color: white;
      padding: 15px 20px;
      text-decoration: none;     /* remove underline */
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
