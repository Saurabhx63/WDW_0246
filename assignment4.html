<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Portal</title>
</head>
<body>
  <!-- Semantic layout: the tag names tell what each part is -->
  <header>
    <h1>College Portal</h1>
  </header>
 
  <nav>
    <a href="#">Home</a> |
    <a href="#">Courses</a>
  </nav>
 
  <main>
    <section>
      <h2>Admission Open</h2>
      <p>Apply before 30 June.</p>
    </section>
  </main>
 
  <!-- Non-semantic: a div only groups things, it has no meaning -->
  <div>Notice: Library closed Sunday.</div>
 
  <footer>&copy; 2026 College</footer>
</body>
</html>
