<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nested Table</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #555555; padding: 10px 14px; }
    .outer td, .outer th { text-align: center; }
    .inner td, .inner th { text-align: left; }
  </style>
</head>
<body>
  <!-- This div adds a scroll bar on small screens -->
  <div style="overflow-x: auto;">
    <table class="outer">
      <tr>
        <th>Day</th>
        <th>Lab Batches</th>
        <th>Faculty</th>
        <th>Room</th>
        <th>Time</th>
      </tr>
      <tr>
        <td>Friday</td>
        <td>
          <!-- A table inside a cell (nested table) -->
          <table class="inner">
            <tr>
              <th>Batch</th>
              <th>System</th>
            </tr>
            <tr>
              <td>A1</td>
              <td>PC 1-20</td>
            </tr>
            <tr>
              <td>A2</td>
              <td>PC 21-40</td>
            </tr>
          </table>
        </td>
        <td>Dr. Sharma</td>
        <td>Lab 2</td>
        <td>2-4 PM</td>
      </tr>
    </table>
  </div>
</body>
</html>
